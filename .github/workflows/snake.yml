name: Contribution snake

# Redraws the amber snake that eats the contribution graph and publishes it
# to the `output` branch, which the README reads from.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb020&color_dots=#1c1a21,#4a3410,#8a5a0c,#d48a12,#ffb020
            dist/snake-light.svg?palette=github-light&color_snake=#e07800&color_dots=#efeae0,#ffe08a,#ffc54d,#ffa21a,#d97706

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

roke-linecap="round" stroke-linejoin="round"><polyline points="30,12 8,50 30,88" stroke="#fff4d6" stroke-width="10"/><polyline points="70,12 92,50 70,88" stroke="#fff4d6" stroke-width="10"/><line x1="32" y1="50" x2="68" y2="50" stroke="#ffb020" stroke-width="12"/></g><text class="s" x="116" y="90" font-size="50" font-weight="800" letter-spacing="-1.5" fill="#fff4d6">Honey<tspan fill="#ffb020">Labs</tspan></text><text class="m" x="940.8" y="80" font-size="13" fill="#9c937f" letter-spacing="1.8" textLength="211.2" lengthAdjust="spacingAndGlyphs">MY INDEPENDENT R&amp;D LAB</text><text class="s" x="46" y="168" font-size="42" font-weight="800" letter-spacing="-1" fill="#fff4d6">We create digital living beings.</text><text class="s" x="48" y="208" font-size="20" fill="#d9cfb8">Local, persistent AI minds that remember, reason and sleep. <tspan fill="#ffb020" font-weight="600">HLLM</tspan> is the flagship.</text><rect x="48" y="250" width="352" height="150" rx="20" fill="url(#lt0-bg)"/><rect x="48.75" y="250.75" width="350.5" height="148.5" rx="19.25" fill="none" stroke="#fff4d6" stroke-opacity="0.1" stroke-width="1.5"/><text class="s" x="72" y="308" font-size="44" font-weight="800" letter-spacing="-1" fill="#ffb020">38<tspan font-size="22" font-weight="600" fill="#fff4d6" letter-spacing="0"> words/s</tspan></text><text class="s" x="72" y="336" font-size="15.5" fill="#d9cfb8">HLLM-1 27B on a single RTX 4070 Ti SUPER</text><rect x="72" y="356" width="304" height="6" rx="3" fill="#fff4d6" fill-opacity=".08"/><rect x="72" y="356" width="121.6" height="6" rx="3" fill="#ffb020"><animate attributeName="width" values="121.6;121.6;192.5;192.5" keyTimes="0;.25;.55;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 .8 .2 1;0 0 1 1"/></rect><line x1="375" y1="351" x2="375" y2="367" stroke="#ffe08a" stroke-width="2"/><text class="m" x="72" y="384" font-size="11.5" fill="#9c937f" textLength="255.3" lengthAdjust="spacingAndGlyphs">v0.45: 24  →  v0.48: 38  ·  target 60</text><rect x="424" y="250" width="352" height="150" rx="20" fill="url(#lt1-bg)"/><rect x="424.75" y="250.75" width="350.5" height="148.5" rx="19.25" fill="none" stroke="#fff4d6" stroke-opacity="0.1" stroke-width="1.5"/><text class="s" x="448" y="308" font-size="44" font-weight="800" letter-spacing="-1" fill="#ffb020">7<tspan font-size="22" font-weight="600" fill="#fff4d6" letter-spacing="0"> s</tspan></text><text class="s" x="448" y="336" font-size="15.5" fill="#d9cfb8">to the first word over a 256k-token context</text><rect x="448" y="356" width="304" height="6" rx="3" fill="#fff4d6" fill-opacity=".08"/><rect x="448" y="356" width="304.0" height="6" rx="3" fill="#ffb020"><animate attributeName="width" values="304.0;304.0;11.8;11.8" keyTimes="0;.25;.55;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 .8 .2 1;0 0 1 1"/></rect><text class="m" x="448" y="384" font-size="11.5" fill="#9c937f" textLength="151.8" lengthAdjust="spacingAndGlyphs">was ~3 min  →  now 7 s</text><rect x="800" y="250" width="352" height="150" rx="20" fill="url(#lt2-bg)"/><rect x="800.75" y="250.75" width="350.5" height="148.5" rx="19.25" fill="none" stroke="#fff4d6" stroke-opacity="0.1" stroke-width="1.5"/><text class="s" x="824" y="308" font-size="44" font-weight="800" letter-spacing="-1" fill="#ffb020">100%<tspan font-size="22" font-weight="600" fill="#fff4d6" letter-spacing="0"> local</tspan></text><text class="s" x="824" y="336" font-size="15.5" fill="#d9cfb8">a mind that lives in your home, not a cloud</text><rect x="824" y="356" width="304" height="6" rx="3" fill="#fff4d6" fill-opacity=".08"/><rect x="824" y="356" width="304" height="6" rx="3" fill="url(#lt-flow)"/><text class="m" x="824" y="384" font-size="11.5" fill="#9c937f" textLength="269.1" lengthAdjust="spacingAndGlyphs">private by design: your data stays home</text><rect x="0.75" y="0.75" width="1198.5" height="434.5" rx="29.25" fill="none" stroke="#fff4d6" stroke-opacity="0.1" stroke-width="1.5
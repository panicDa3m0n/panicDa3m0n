t="0" stop-color="#1c1a21"/><stop offset="1" stop-color="#121116"/></linearGradient><clipPath id="lt2-clip"><rect x="800" y="250" width="352" height="150" rx="20"/></clipPath><linearGradient id="lt-flow" gradientUnits="userSpaceOnUse" x1="824" y1="0" x2="1128" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#ffb020"/><stop offset=".5" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb020"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="304 0" dur="3s" repeatCount="indefinite"/></linearGradient></defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
<title id="t">Let's build what comes next</title>
<desc id="d">Open to collaboration on projects of general interest, experimental research and futuristic ideas: digital individuals, agentic systems, open ports of closed platforms. Open an issue to say hi.</desc>
<style>
.s{font-family:'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.lit{opacity:0;animation:pulse 6s ease-in-out infinite}
.cur{animation:blink 1.05s step-end infinite}
.comet{animation:comet 5s linear infinite}
.breathe{animation:breathe 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:1}}
@keyframes wave{0%{opacity:0}4%{opacity:1}12%,100%{opacity:0}}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes comet{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,26px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,18px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(36px,-34px)}}
@keyframes scan{from{transform:translateX(-260px)}to{transform:translateX(1460px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17151d"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><clipPath id="c-clip"><rect x="0" y="0" width="1200" height="380" rx="30"/></clipPath><pattern id="c-hex" width="41.569" height="72.000" patternUnits="userSpaceOnUse"><g fill="none" stroke="#fff4d6" stroke-opacity="0.1" stroke-width="1.2"><polygon points="0.00,-22.08 19.12,-11.04 19.12,11.04 0.00,22.08 -19.12,11.04 -19.12,-11.04"/><polygon points="41.57,-22.08 60.69,-11.04 60.69,11.04 41.57,22.08 22.45,11.04 22.45,-11.04"/><polygon points="20.78,13.92 39.91,24.96 39.91,47.04 20.78,58.08 1.66,47.04 1.66,24.96"/><polygon points="0.00,49.92 19.12,60.96 19.12,83.04 0.00,94.08 -19.12,83.04 -19.12,60.96"/><polygon points="41.57,49.92 60.69,60.96 60.69,83.04 41.57,94.08 22.45,83.04 22.45,60.96"/></g></pattern><radialGradient id="c-fade" cx="600.0" cy="380" r="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="c-mask"><rect width="1200" height="380" fill="url(#c-fade)"/></mask><radialGradient id="cb1"><stop offset="0" stop-color="#ffb020" stop-opacity="0.22"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient><radialGradient id="cb2"><stop offset="0" stop-color="#ff8a1f" stop-opacity="0.12"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient><radialGradient id="cb3"><stop offset="0" stop-color="#ffe08a" stop-opacity="0.1"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="1200" height="380" rx="30" fill="url(#c-bg)"/><g clip-path="url(#c-clip)"><circle cx="600" cy="420" r="420" fill="url(#cb1)" style="animation:d1 20s ease-in-out infinite"/><circle cx="150" cy="0" r="260" fill="url(#cb2)" style="animation:d3 24s ease-in-out infinite"/><circle cx="1080" cy="40" r="260" fill="url(#cb3)" style="animation:d2 26s ease-in-out infinite"/><rect width="1200" height="380" fill="url(#c-hex)" mask="url(#c-mask)"/><polygon class="lit" points="498.83,481.92 517.95,492.96 517.95,515.04 498.83,526.08 479.71,515.04 479.71,492.96" fill="#ffb020" fill-opacity="0.3" style="animation-delay:-0s;animation-duration:6s"/><polygon class="lit" points="602.75,445.92 621.88,456.96 621.88,479.04 602.75,490.08 583.63,479.04 583.63,456.96" fill="#ffb020" fill-opacity="0.25" style="animation-delay:-2s;animation-duration:7s"/><polygon class="lit" points="436.48,445.92 455.60,456.96 455.60,479.04 436.48,490.08 417.35,479.04 417.35,456.96" fill="#ffb020" fill-opacity="0.2" style="animation-delay:-3.5s;animation-duration:8s"/><polygon class="lit" points="665.11,481.92 684.23,492.96 684.23,515.04 665.11,526.08 645.99,515.04 645.99,492.96" fill="#ffb020" fill-opacity="0.2" style="animation-delay:-1s;animation-duration:6.5s"/><polygon class="lit" points="332.55,481.92 351.68,492.96 351.68,515.04 332.55,526.08 313.43,515.04 313.43,492.96" fill="#ffb020" fill-opacity="0.15" style="animation-delay:-4.2s;animation-duration:7s"/><polygon class="lit" points="540.40,409.92 559.52,420.96 559.52,443.04 540.40,454.08 521.28,443.04 521.28,420.96" fill="#ffb020" fill-opacity="0.15" style="animation-delay:-5.1s;animation-duration:9s"/></g><circle cx="472.3" cy="61" r="5" fill="#ffb020"/><circle cx="472.3" cy="61" r="5" fill="none" stroke="#ffb020" stroke-width="2"><animate attributeName="r" values="5;13" dur="1.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/></circle><text class="m" x="492.3" y="66" font-size="14" fill="#ffb020" letter-spacing="3" textLength="239.4" lengthAdjust="spacingAndGlyphs">OPEN TO COLLABORATION</text><text class="s" x="600.0" y="136" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#fff4d6">Let's build <tspan fill="#ffb020">what comes next.</tspan></text><text class="s" x="600.0" y="186" text-anchor="middle" font-size="21" fill="#d9cfb8">Projects of general interest, experimental research and futuristic ideas:</text><text class="s" x="600.0" y="218" text-anchor="middle" font-size="21" fill="#d9cfb8">digital individuals, agentic systems, open ports of closed platforms.</text><rect x="439.4" y="254" width="321.2" height="54" rx="27" fill="#ffb020"/><rect x="439.4" y="254" width="321.2" height="54" rx="27" fill="none" stroke="#ffe08a" stroke-width="2" class="breathe"/><text class="m" x="467.4" y="287" font-size="17" fill="#1a1205" textLength="265.2" lengthAdjust="spacingAndGlyphs" font-weight="700">Open an issue to say hi  →</text><g transform="translate(587.0 330) scale(0.2600)" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="30,12 8,50 30,88" stroke="#fff4d6" stroke-width="11"/><polyline points="70,12 92,50 70,88" stroke="#fff4d6" stroke-width="11"/><line x1="32" y1="50" x2="68" y2="50" stroke="#ffb020" stroke-width="13"/></g><rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="29.25" fill="none" stroke="#fff4d6" stroke-opacity="0.1" stroke-width="1.5"/>
</svg>

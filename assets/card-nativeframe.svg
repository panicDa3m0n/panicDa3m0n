<svg xmlns="http://www.w3.org/2000/svg" width="612" height="312" viewBox="0 0 612 312" role="img" aria-labelledby="t d">
<title id="t">NativeFrame: Open Source · Maintainer</title>
<desc id="d">NativeFrame. Native PC ports of console games. My performance fork of AnyPS5: static conversion, rebuilt system libraries, Vulkan rendering. Target: 60 FPS.</desc>
<style>
.s{font-family:'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.lit{opacity:0;animation:pulse 6s ease-in-out infinite}
.cur{animation:blink 1.05s step-end infinite}
.comet{animation:comet 5s linear infinite}
.breathe{animation:breathe 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:1}}
@keyframes wave{0%{opacity:0}4%{opacity:1}12%,100%{opacity:0}}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes comet{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,26px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,18px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(36px,-34px)}}
@keyframes scan{from{transform:translateX(-260px)}to{transform:translateX(1460px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="card-nativeframe-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17151d"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><clipPath id="card-nativeframe-clip"><rect x="0" y="0" width="600" height="312" rx="24"/></clipPath><pattern id="card-nativeframe-hex" width="31.177" height="54.000" patternUnits="userSpaceOnUse"><g fill="none" stroke="#fff4d6" stroke-opacity="0.11" stroke-width="1.2"><polygon points="0.00,-16.56 14.34,-8.28 14.34,8.28 0.00,16.56 -14.34,8.28 -14.34,-8.28"/><polygon points="31.18,-16.56 45.52,-8.28 45.52,8.28 31.18,16.56 16.84,8.28 16.84,-8.28"/><polygon points="15.59,10.44 29.93,18.72 29.93,35.28 15.59,43.56 1.25,35.28 1.25,18.72"/><polygon points="0.00,37.44 14.34,45.72 14.34,62.28 0.00,70.56 -14.34,62.28 -14.34,45.72"/><polygon points="31.18,37.44 45.52,45.72 45.52,62.28 31.18,70.56 16.84,62.28 16.84,45.72"/></g></pattern><radialGradient id="card-nativeframe-fade" cx="560" cy="20" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="card-nativeframe-mask"><rect width="600" height="312" fill="url(#card-nativeframe-fade)"/></mask><radialGradient id="card-nativeframe-g"><stop offset="0" stop-color="#ffb020" stop-opacity="0.17"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient></defs>
<g transform="translate(12 0)"><rect x="0" y="0" width="600" height="312" rx="24" fill="url(#card-nativeframe-bg)"/><g clip-path="url(#card-nativeframe-clip)"><circle cx="560" cy="10" r="230" fill="url(#card-nativeframe-g)" style="animation:d2 18s ease-in-out infinite"/><rect width="600" height="312" fill="url(#card-nativeframe-hex)" mask="url(#card-nativeframe-mask)"/></g><text class="m" x="36" y="52" font-size="12.5" fill="#ffb020" letter-spacing="2" textLength="228.0" lengthAdjust="spacingAndGlyphs">OPEN SOURCE · MAINTAINER</text><rect x="481.2" y="30" width="86.8" height="32" rx="16.0" fill="#ffb020" fill-opacity="0.08" stroke="#ffb020" stroke-opacity="0.4" stroke-width="1.2"/><text class="m" x="495.2" y="51.04" font-size="14" fill="#ffb020" textLength="58.8" lengthAdjust="spacingAndGlyphs">GPL-2.0</text><text class="s" x="34" y="114" font-size="42" font-weight="800" letter-spacing="-1.2" fill="#fff4d6">NativeFrame</text><text class="s" x="36" y="158" font-size="18" fill="#d9cfb8">Native PC ports of console games. My performance</text><text class="s" x="36" y="186" font-size="18" fill="#d9cfb8">fork of AnyPS5: static conversion, rebuilt system</text><text class="s" x="36" y="214" font-size="18" fill="#d9cfb8">libraries, Vulkan rendering. Target: 60 FPS.</text><rect x="36.0" y="248" width="61.5" height="30" rx="15.0" fill="#0c0b10" fill-opacity="0.55" stroke="#fff4d6" stroke-opacity="0.16" stroke-width="1.2"/><text class="m" x="48.0" y="267.5" font-size="12.5" fill="#d9cfb8" textLength="37.5" lengthAdjust="spacingAndGlyphs">C++20</text><rect x="105.5" y="248" width="69.0" height="30" rx="15.0" fill="#0c0b10" fill-opacity="0.55" stroke="#fff4d6" stroke-opacity="0.16" stroke-width="1.2"/><text class="m" x="117.5" y="267.5" font-size="12.5" fill="#d9cfb8" textLength="45.0" lengthAdjust="spacingAndGlyphs">Vulkan</text><rect x="182.5" y="248" width="69.0" height="30" rx="15.0" fill="#0c0b10" fill-opacity="0.55" stroke="#fff4d6" stroke-opacity="0.16" stroke-width="1.2"/><text class="m" x="194.5" y="267.5" font-size="12.5" fill="#d9cfb8" textLength="45.0" lengthAdjust="spacingAndGlyphs">SPIR-V</text><rect x="259.5" y="248" width="61.5" height="30" rx="15.0" fill="#0c0b10" fill-opacity="0.55" stroke="#fff4d6" stroke-opacity="0.16" stroke-width="1.2"/><text class="m" x="271.5" y="267.5" font-size="12.5" fill="#d9cfb8" textLength="37.5" lengthAdjust="spacingAndGlyphs">CMake</text><text class="m" x="482.2" y="268" font-size="13" fill="#9c937f" textLength="85.8" lengthAdjust="spacingAndGlyphs">NativeFrame</text><polygon points="468.20,257.00 473.40,260.00 473.40,266.00 468.20,269.00 463.00,266.00 463.00,260.00" fill="#ffb020" class="breathe"/><rect x="0.75" y="0.75" width="598.5" height="310.5" rx="23.25" fill="none" stroke="#fff4d6" stroke-opacity="0.1" stroke-width="1.5"/></g>
</svg>

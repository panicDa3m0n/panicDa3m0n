so they can be fixed.</tspan></text><text class="m" x="248.0" y="186" font-size="22" fill="#fff4d6" letter-spacing="3" textLength="64.8" lengthAdjust="spacingAndGlyphs">SONY</text><polygon points="332.80,174.00 337.13,176.50 337.13,181.50 332.80,184.00 328.47,181.50 328.47,176.50" fill="#ffb020"/><text class="m" x="352.8" y="186" font-size="22" fill="#fff4d6" letter-spacing="3" textLength="145.8" lengthAdjust="spacingAndGlyphs">MICROSOFT</text><polygon points="518.60,174.00 522.93,176.50 522.93,181.50 518.60,184.00 514.27,181.50 514.27,176.50" fill="#ffb020"/><text class="m" x="538.6" y="186" font-size="22" fill="#fff4d6" letter-spacing="3" textLength="113.4" lengthAdjust="spacingAndGlyphs">SAMSUNG</text><polygon points="672.00,174.00 676.33,176.50 676.33,181.50 672.00,184.00 667.67,181.50 667.67,176.50" fill="#ffb020"/><text class="m" x="692.0" y="186" font-size="22" fill="#9c937f" letter-spacing="3" textLength="129.6" lengthAdjust="spacingAndGlyphs">AND MORE</text><rect x="0.75" y="0.75" width="1198.5" height="234.5" rx="27.25" fill="none" stroke="#fff4d6" stroke-opacity="0.1" stroke-width="1.5"/>

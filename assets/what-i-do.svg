<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="836" viewBox="0 0 1200 836" role="img" aria-labelledby="t d">
<title id="t">What I do: open systems, living minds</title>
<desc id="d">Four fronts. Digital individuals: studying human memory, sleep, affect and attention to grow persistent AI minds. New-concept operating systems: agent-first OS design, agentic IDEs, multi-agent workflows. Reverse engineering and cracking: binaries, firmware, consoles, static recompilation, native ports. Bug bounty: Sony, Microsoft, Samsung and more, responsible disclosure.</desc>
<style>
.s{font-family:'Bricolage Grotesque','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'Geist Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.lit{opacity:0;animation:pulse 6s ease-in-out infinite}
.cur{animation:blink 1.05s step-end infinite}
.comet{animation:comet 5s linear infinite}
.breathe{animation:breathe 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:1}}
@keyframes wave{0%{opacity:0}4%{opacity:1}12%,100%{opacity:0}}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes comet{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,26px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,18px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(36px,-34px)}}
@keyframes scan{from{transform:translateX(-260px)}to{transform:translateX(1460px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

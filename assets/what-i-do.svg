="22"/></clipPath><linearGradient id="pt3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1920"/><stop offset="1" stop-color="#111015"/></linearGradient><clipPath id="pt3-clip"><rect x="612" y="496" width="556" height="316" rx="22"/></clipPath></defs>
<rect x="0" y="0" width="1200" height="836" rx="30" fill="url(#p-bg)"/><g clip-path="url(#p-clip)"><circle cx="1050" cy="40" r="380" fill="url(#pb1)" style="animation:d2 24s ease-in-out infinite"/><rect width="1200" height="836" fill="url(#p-hex)" mask="url(#p-mask)"/></g><text class="m" x="48" y="66" font-size="15" fill="#ffb020" letter-spacing="3" textLength="108.0" lengthAdjust="spacingAndGlyphs">WHAT I DO</text><text class="s" x="46" y="118" font-size="44" font-weight="800" letter-spacing="-1" fill="#fff4d6">Open systems. <tspan fill="#ffb020">Living minds.</tspan></text><rect x="32" y="156" width="556" height="316" rx="22" fill="url(#pt0-bg)"/><rect x="32.75" y="156.75" width="554.5" height="314.5" rx="21.25" fill="none" stroke="#fff4d6" stroke-opacity="0.09" stroke-width="1.5"/><polygon points="108.00,194.00 140.91,213.00 140.91,251.00 108.00,270.00 75.09,251.00 75.09,213.00" fill="#0c0b10" fill-opacity=".6" stroke="#fff4d6" stroke-opacity=".16" stroke-width="1.5"/><polygon points="108.00,194.00 140.91,213.00 140.91,251.00 108.00,270.00 75.09,251.00 75.09,213.00" pathLength="100" fill="none" stroke="#ffb020" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 86" class="comet" style="animation-delay:-0.0s"/><circle cx="108" cy="232" r="6" fill="#ffb020"/><g style="transform-origin:108px 232px;animation:spin 6s linear infinite"><ellipse cx="108" cy="232" rx="19" ry="8" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="127" cy="232" r="3" fill="#ffe08a"/></g><g style="transform-origin:108px 232px;animation:spinr 9s linear infinite"><ellipse cx="108" cy="232" rx="8" ry="19" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".55"/></g><text class="m" x="534.0" y="218" font-size="15" fill="#9c937f" textLength="18.0" lengthAdjust="spacingAndGlyphs">01</text><text class="s" x="72" y="314" font-size="29" font-weight="750" fill="#fff4d6">Digital individuals</text><text class="s" x="72" y="352" font-size="19" fill="#d9cfb8">Studying how humans remember, sleep, feel and</text><text class="s" x="72" y="380" font-size="19" fill="#d9cfb8">pay attention, to grow persistent AI minds that</text><text class="s" x="72" y="408" font-size="19" fill="#d9cfb8">can honestly call themselves digital living beings.</text><text class="m" x="72" y="440" font-size="12.5" fill="#ffb020" letter-spacing="1.2" textLength="408.9" lengthAdjust="spacingAndGlyphs">LLM AGENTS · COGNITIVE ARCHITECTURES · LOCAL AI</text><rect x="612" y="156" width="556" height="316" rx="22" fill="url(#pt1-bg)"/><rect x="612.75" y="156.75" width="554.5" height="314.5" rx="21.25" fill="none" stroke="#fff4d6" stroke-opacity="0.09" stroke-width="1.5"/><polygon points="688.00,194.00 720.91,213.00 720.91,251.00 688.00,270.00 655.09,251.00 655.09,213.00" fill="#0c0b10" fill-opacity=".6" stroke="#fff4d6" stroke-opacity=".16" stroke-width="1.5"/><polygon points="688.00,194.00 720.91,213.00 720.91,251.00 688.00,270.00 655.09,251.00 655.09,213.00" pathLength="100" fill="none" stroke="#ffb020" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 86" class="comet" style="animation-delay:-1.25s"/><rect x="671" y="218" width="34" height="28" rx="5" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="671" y1="226" x2="705" y2="226" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="678" y="231" width="8" height="8" rx="1.5" fill="#ffb020" class="breathe"/><rect x="690" y="231" width="8" height="8" rx="1.5" fill="#ffe08a" fill-opacity=".7" class="breathe" style="animation-delay:-2.5s"/><text class="m" x="1114.0" y="218" font-size="15" fill="#9c937f" textLength="18.0" lengthAdjust="spacingAndGlyphs">02</text><text class="s" x="652" y="314" font-size="29" font-weight="750" fill="#fff4d6">New-concept operating systems</text><text class="s" x="652" y="352" font-size="19" fill="#d9cfb8">Agent-first OS design: machines that are run,</text><text class="s" x="652" y="380" font-size="19" fill="#d9cfb8">maintained and evolved by AI agents. Agentic IDEs</text><text class="s" x="652" y="408" font-size="19" fill="#d9cfb8">and multi-agent workflows are my daily driver.</text><text class="m" x="652" y="440" font-size="12.5" fill="#ffb020" letter-spacing="1.2" textLength="374.1" lengthAdjust="spacingAndGlyphs">AGENT-FIRST OS · AGENTIC IDES · MULTI-AGENT</text><rect x="32" y="496" width="556" height="316" rx="22" fill="url(#pt2-bg)"/><rect x="32.75" y="496.75" width="554.5" height="314.5" rx="21.25" fill="none" stroke="#fff4d6" stroke-opacity="0.09" stroke-width="1.5"/><polygon points="108.00,534.00 140.91,553.00 140.91,591.00 108.00,610.00 75.09,591.00 75.09,553.00" fill="#0c0b10" fill-opacity=".6" stroke="#fff4d6" stroke-opacity=".16" stroke-width="1.5"/><polygon points="108.00,534.00 140.91,553.00 140.91,591.00 108.00,610.00 75.09,591.00 75.09,553.00" pathLength="100" fill="none" stroke="#ffb020" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 86" class="comet" style="animation-delay:-2.5s"/><polyline points="100,559 90,572 100,585" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="116,559 126,572 116,585" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="112" y1="557" x2="104" y2="587" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="breathe"/><text class="m" x="534.0" y="558" font-size="15" fill="#9c937f" textLength="18.0" lengthAdjust="spacingAndGlyphs">03</text><text class="s" x="72" y="654" font-size="29" font-weight="750" fill="#fff4d6">Reverse engineering &amp; cracking</text><text class="s" x="72" y="692" font-size="19" fill="#d9cfb8">Binaries, firmware, consoles: static recompilation,</text><text class="s" x="72" y="720" font-size="19" fill="#d9cfb8">native ports and closed formats cracked open,</text><text class="s" x="72" y="748" font-size="19" fill="#d9cfb8">because locked knowledge is lost knowledge.</text><text class="m" x="72" y="780" font-size="12.5" fill="#ffb020" letter-spacing="1.2" textLength="321.9" lengthAdjust="spacingAndGlyphs">RE · CRACKING · NATIVE PORTS · VULKAN</text><rect x="612" y="496" width="556" height="316" rx="22" fill="url(#pt3-bg)"/><rect x="612.75" y="496.75" width="554.5" height="314.5" rx="21.25" fill="none" stroke="#fff4d6" stroke-opacity="0.09" stroke-width="1.5"/><polygon points="688.00,534.00 720.91,553.00 720.91,591.00 688.00,610.00 655.09,591.00 655.09,553.00" fill="#0c0b10" fill-opacity=".6" stroke="#fff4d6" stroke-opacity=".16" stroke-width="1.5"/><polygon points="688.00,534.00 720.91,553.00 720.91,591.00 688.00,610.00 655.09,591.00 655.09,553.00" pathLength="100" fill="none" stroke="#ffb020" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="14 86" class="comet" style="animation-delay:-3.75s"/><circle cx="688" cy="572" r="14" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><g style="transform-origin:688px 572px;animation:spin 8s linear infinite"><line x1="688" y1="550" x2="688" y2="556" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="688" y1="588" x2="688" y2="594" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="666" y1="572" x2="672" y2="572" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="704" y1="572" x2="710" y2="572" fill="none" stroke="#ffb020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="688" cy="572" r="4" fill="#ffb020" class="breathe"/><text class="m" x="1114.0" y="558" font-size="15" fill="#9c937f" textLength="18.0" lengthAdjust="spacingAndGlyphs">04</text><text class="s" x="652" y="654" font-size="29" font-weight="750" fill="#fff4d6">Bug bounty</text><text class="s" x="652" y="692" font-size="19" fill="#d9cfb8">Active hunter in the bug bounty programs of Sony,</text><text class="s" x="652" y="720" font-size="19" fill="#d9cfb8">Microsoft, Samsung and more. Responsible</text><text class="s" x="652" y="748" font-size="19" fill="#d9cfb8">disclosure: break it, report it, make it safer.</text><text class="m" x="652" y="780" font-size="12.5" fill="#ffb020" letter-spacing="1.2" textLength="365.4" lengthAdjust="spacingAndGlyphs">SECURITY RESEARCH · RESPONSIBLE DISCLOSURE</text><rect x="0.75" y="0.75" width="1198.5" height="834.5" rx="29.25" fill="none" stroke="#fff4d6" stroke-opacity="0.1" stroke-width="1.5"/>
</svg>
